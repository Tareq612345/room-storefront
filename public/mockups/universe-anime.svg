<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="glowOrchid" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#C94B99" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#4D1943" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05030A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheetOrchid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190E1C"/>
      <stop offset="100%" stop-color="#08040B"/>
    </linearGradient>
    <linearGradient id="neonOrchid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C94B99" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C94B99" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#06030A"/>
  <rect width="800" height="600" fill="url(#glowOrchid)"/>
  <!-- Eclipse Halo -->
  <circle cx="400" cy="145" r="85" stroke="#C94B99" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="400" cy="145" r="68" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <!-- Headboard -->
  <rect x="130" y="130" width="540" height="140" rx="18" fill="#120917" stroke="#C94B99" stroke-opacity="0.32" stroke-width="2"/>
  <rect x="160" y="123" width="480" height="4" rx="2" fill="url(#neonOrchid)"/>
  <!-- Pillows -->
  <rect x="180" y="175" width="205" height="90" rx="16" fill="#1C0E22" stroke="#C94B99" stroke-opacity="0.58" stroke-width="2"/>
  <rect x="415" y="175" width="205" height="90" rx="16" fill="#1C0E22" stroke="#C94B99" stroke-opacity="0.58" stroke-width="2"/>
  <!-- Mattress & Bedsheet -->
  <rect x="115" y="250" width="570" height="245" rx="24" fill="url(#sheetOrchid)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <!-- Neo-Tokyo Sash Line -->
  <path d="M115 338 H685" stroke="#C94B99" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- 4-Point Star Embroidery -->
  <path d="M400 375 C402 402, 410 410, 437 412 C410 414, 402 422, 400 449 C398 422, 390 414, 363 412 C390 410, 398 402, 400 375 Z" stroke="#F472B6" stroke-width="2" fill="#140919"/>
  <!-- Floor Neon -->
